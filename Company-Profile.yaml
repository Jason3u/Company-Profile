# ============================================================
#  Company Profile
#  个人 Clash 分流配置（适用于 Clash Meta / Mihomo 内核）
#
#  【分流策略】
#   1. 国内网站/应用      → 直连
#   2. 国外软件/网站      → 代理（默认节点，可手动切换）
#   3. 流媒体(YouTube/Pinterest 等) → 默认日本/香港节点
#   4. AI 服务           → 默认美国节点
#   5. RunningHub        → 默认香港节点
#   6. TapNow            → 默认香港节点
#   7. WorkBuddy         → 全部直连
#   8. Adobe 全家桶      → 全部断网（REJECT）
#
#   ⚠️ 美国节点仅默认提供给 AI 服务使用（保证 AI 风控风险最低）
#
#  【适用客户端】
#   Clash Verge Rev / Mihomo Party / FlClash / Clash Meta
# ============================================================

# ---------- 基础设置 ----------
mixed-port: 7890          # 代理端口（HTTP/SOCKS5 共用）
allow-lan: false          # 是否允许局域网内其他设备连接
mode: rule                # 分流模式
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict  # 严格识别发起连接的进程，用于 WorkBuddy 强制直连
# external-controller: 127.0.0.1:9090   # 如需 Web 控制面板可取消注释

# 记住节点选择（客户端重启后保持之前的节点选择）
profile:
  store-selected: true
  store-fake-ip: true

# ---------- DNS 设置 ----------
dns:
  enable: true
  ipv6: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  fallback:
    - 1.1.1.1
    - 8.8.8.8
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
    domain:
      - "+.google.com"
      - "+.facebook.com"
      - "+.youtube.com"
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "time.windows.com"
    - "time.nist.gov"
    - "time.apple.com"
    # WorkBuddy 分享页使用腾讯云动态加速，保留真实 IP，避免 Fake-IP 影响入口选择
    - "workbuddy.link"
    - "*.workbuddy.link"
  nameserver-policy:
    "geosite:cn":
      - 223.5.5.5
      - 119.29.29.29
    # WorkBuddy 分享链接固定用国内 DNS 解析，不使用境外 fallback
    "+.workbuddy.link":
      - 119.29.29.29
      - 223.5.5.5

# ============================================================
#  订阅链接（已填入，仅分享给信任的人）
#  机场：良心云 liangxin.xyz
# ============================================================
proxy-providers:
  Provider:
    type: http
    url: "https://liangxin.xyz/api/v1/liangxin?OwO=08473de9c81c32890fb3c8744ba74b5b"
    interval: 86400                  # 订阅更新间隔（秒），每天更新一次
    path: ./providers/provider.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

# ---------- 代理组 ----------
proxy-groups:
  # 默认出口：所有未命中国内规则的外网流量都从这里走
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🌍 流媒体专用
      - 🤖 AI专用
      - 🎯 国内直连
      - 🛑 拦截
    use:
      - Provider

  # 自动测速选择延迟最低的节点
  - name: ♻️ 自动选择
    type: url-test
    use:
      - Provider
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  # 日本节点池
  - name: 🇯🇵 日本节点
    type: url-test
    use:
      - Provider
    filter: '(?i)\bJP\b|日本|东京|大阪|名古屋|Japan|Tokyo|Osaka|Nagoya'
    url: http://www.gstatic.com/generate_204
    interval: 300

  # 香港节点池
  - name: 🇭🇰 香港节点
    type: url-test
    use:
      - Provider
    filter: '(?i)\bHK\b|香港|Hong ?Kong'
    url: http://www.gstatic.com/generate_204
    interval: 300

  # 美国节点池
  - name: 🇺🇸 美国节点
    type: url-test
    use:
      - Provider
    filter: '(?i)\bUS\b|\bUSA\b|美国|美西|美东|洛杉矶|圣何塞|硅谷|纽约|达拉斯|Los Angeles|San Jose|Silicon|New York|Dallas'
    url: http://www.gstatic.com/generate_204
    interval: 300

  # 流媒体专用：默认日本，可手动切香港
  - name: 🌍 流媒体专用
    type: select
    proxies:
      - 🇯🇵 日本节点
      - 🇭🇰 香港节点
      - ♻️ 自动选择
      - 🎯 国内直连

  # AI 专用：默认美国
  - name: 🤖 AI专用
    type: select
    proxies:
      - 🇺🇸 美国节点
      - ♻️ 自动选择

  # RunningHub：默认香港节点
  - name: 🎨 RunningHub
    type: select
    proxies:
      - 🇭🇰 香港节点
      - ♻️ 自动选择

  # TapNow：默认香港节点（美国节点仅保留给 AI 使用）
  - name: 🎨 TapNow
    type: select
    proxies:
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - ♻️ 自动选择

  # 国内直连
  - name: 🎯 国内直连
    type: select
    proxies:
      - DIRECT

  # 拦截（Adobe 断网）
  - name: 🛑 拦截
    type: select
    proxies:
      - REJECT

# ---------- 分流规则（从上到下匹配，顺序很重要） ----------
rules:
  # ===== 1. Adobe 全家桶：全部断网（放在最前面，优先级最高） =====
  # 注意：以下规则会拦截所有 Adobe 域名，应用将完全无法联网；
  #       若日后购买了正版 Adobe，请删除本段规则。
  # 关键词兜底：任何域名只要含 "adobe" 字样一律拦截（最彻底的兜底）
  - DOMAIN-KEYWORD,adobe,🛑 拦截
  # ---- Adobe 主域名 ----
  - DOMAIN-SUFFIX,adobe.com,🛑 拦截
  - DOMAIN-SUFFIX,adobe.net,🛑 拦截
  - DOMAIN-SUFFIX,adobe.io,🛑 拦截
  - DOMAIN-SUFFIX,adobe-dns.com,🛑 拦截
  - DOMAIN-SUFFIX,adobelogin.com,🛑 拦截
  - DOMAIN-SUFFIX,adobess.com,🛑 拦截
  - DOMAIN-SUFFIX,adobegenuine.com,🛑 拦截
  - DOMAIN-SUFFIX,adobespark.com,🛑 拦截
  - DOMAIN-SUFFIX,adobestock.com,🛑 拦截
  - DOMAIN-SUFFIX,adobefonts.com,🛑 拦截
  - DOMAIN-SUFFIX,adobeconnect.com,🛑 拦截
  - DOMAIN-SUFFIX,adobeexchange.com,🛑 拦截
  - DOMAIN-SUFFIX,adobecqms.net,🛑 拦截
  - DOMAIN-SUFFIX,adobedtm.com,🛑 拦截
  # ---- Adobe 关联 / 收购产品 ----
  - DOMAIN-SUFFIX,behance.net,🛑 拦截
  - DOMAIN-SUFFIX,behance.com,🛑 拦截
  - DOMAIN-SUFFIX,photoshop.com,🛑 拦截
  - DOMAIN-SUFFIX,magento.com,🛑 拦截
  - DOMAIN-SUFFIX,marketo.com,🛑 拦截
  - DOMAIN-SUFFIX,echosign.com,🛑 拦截
  - DOMAIN-SUFFIX,typekit.com,🛑 拦截
  - DOMAIN-SUFFIX,typekit.net,🛑 拦截
  - DOMAIN-SUFFIX,scene7.com,🛑 拦截
  # ---- Adobe Analytics / 数据追踪 ----
  - DOMAIN-SUFFIX,omniture.com,🛑 拦截
  - DOMAIN-SUFFIX,omtrdc.net,🛑 拦截
  - DOMAIN-SUFFIX,demdex.net,🛑 拦截
  - DOMAIN-SUFFIX,everesttech.net,🛑 拦截
  - DOMAIN-SUFFIX,2o7.net,🛑 拦截
  - DOMAIN-SUFFIX,adobestats.io,🛑 拦截

  # ===== 2. 内网/本地流量直连 =====
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve

  # ===== 3. 腾讯 WorkBuddy：强制直连，禁止走代理 =====
  # 直接指向 DIRECT，不使用可手动切换的策略组。
  # 路径规则同时覆盖 WorkBuddy 安装目录中的更新器、运行时和子进程。
  - PROCESS-NAME,WorkBuddy.exe,DIRECT
  - PROCESS-NAME,WorkBuddy Service.exe,DIRECT
  - PROCESS-NAME,workbuddy-service.exe,DIRECT
  - PROCESS-PATH-REGEX,(?i).*\\WorkBuddy\\.*,DIRECT
  # WorkBuddy 主站、文档和分享链接
  - DOMAIN-SUFFIX,workbuddy.link,DIRECT
  - DOMAIN-SUFFIX,workbuddy.ai,DIRECT
  - DOMAIN-SUFFIX,workbuddy.cn,DIRECT
  - DOMAIN-SUFFIX,workbuddy.tencent.com,DIRECT
  # WorkBuddy 分享页的腾讯云全局加速 CNAME
  - DOMAIN-SUFFIX,qcloudzygj.com,DIRECT
  - DOMAIN-SUFFIX,qcloudwzgj.com,DIRECT
  # 腾讯官方主服务 / OpenAPI / 邀请 / 企业专享域名
  - DOMAIN-SUFFIX,copilot.tencent.com,DIRECT
  - DOMAIN-SUFFIX,copilot-invite.tencent.com,DIRECT
  - DOMAIN-SUFFIX,copilot.qq.com,DIRECT
  # 官方静态资源
  - DOMAIN,acc-1258344699.cos.accelerate.myqcloud.com,DIRECT
  - DOMAIN,cs-res-1258344699.file.myqcloud.com,DIRECT
  # 微信登录链路
  - DOMAIN,open.weixin.qq.com,DIRECT
  - DOMAIN,long.weixin.qq.com,DIRECT
  - DOMAIN,res.weixin.qq.com,DIRECT
  - DOMAIN,localhost.weixin.qq.com,DIRECT

  # ===== 4. AI 服务：走美国节点 =====
  - GEOSITE,openai,🤖 AI专用
  - DOMAIN-SUFFIX,anthropic.com,🤖 AI专用
  - DOMAIN-SUFFIX,claude.ai,🤖 AI专用
  - DOMAIN-SUFFIX,perplexity.ai,🤖 AI专用
  - DOMAIN-SUFFIX,huggingface.co,🤖 AI专用
  - DOMAIN-SUFFIX,midjourney.com,🤖 AI专用
  - DOMAIN-SUFFIX,gemini.google.com,🤖 AI专用
  - DOMAIN-SUFFIX,aistudio.google.com,🤖 AI专用
  - DOMAIN-SUFFIX,deepmind.google,🤖 AI专用
  - DOMAIN-SUFFIX,copilot.microsoft.com,🤖 AI专用
  - DOMAIN-SUFFIX,blackbox.ai,🤖 AI专用

  # ===== 5. RunningHub：默认香港节点 =====
  - DOMAIN-SUFFIX,runninghub.ai,🎨 RunningHub

  # ===== 6. TapNow：默认香港节点 =====
  - DOMAIN-SUFFIX,tapnow.ai,🎨 TapNow

  # ===== 7. 流媒体：走日本/香港节点 =====
  - GEOSITE,youtube,🌍 流媒体专用
  - GEOSITE,netflix,🌍 流媒体专用
  - GEOSITE,disney,🌍 流媒体专用
  - GEOSITE,spotify,🌍 流媒体专用
  - DOMAIN-SUFFIX,pinterest.com,🌍 流媒体专用
  - DOMAIN-SUFFIX,pinimg.com,🌍 流媒体专用
  - DOMAIN-SUFFIX,twitch.tv,🌍 流媒体专用
  - DOMAIN-SUFFIX,dailymotion.com,🌍 流媒体专用
  - DOMAIN-SUFFIX,tiktok.com,🌍 流媒体专用
  - DOMAIN-SUFFIX,tiktokcdn.com,🌍 流媒体专用
  - DOMAIN-SUFFIX,tiktokcdn-us.com,🌍 流媒体专用

  # ===== 8. 国内流量：直连 =====
  - GEOSITE,cn,🎯 国内直连
  - GEOIP,CN,🎯 国内直连,no-resolve

  # ===== 9. 兜底：其余国外流量走默认代理 =====
  - MATCH,🚀 节点选择
